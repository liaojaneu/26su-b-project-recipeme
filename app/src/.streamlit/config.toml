# ------------------------------------------------------------
# Streamlit configuration for RecipeMe
# ------------------------------------------------------------

[client]
# nav.py provides the role-based sidebar navigation.
showSidebarNavigation = false

# Hide the Deploy button and simplify the top-right menu.
toolbarMode = "minimal"


[server]
# Automatically rerun the application when a source file changes.
runOnSave = true


# ------------------------------------------------------------
# Main RecipeMe theme
# ------------------------------------------------------------

[theme]
base = "light"

# Dark burnt orange used for buttons, links, sliders,
# selected controls, and focus indicators.
primaryColor = "#C94B1C"

# Warm cream background with a slightly darker color for
# cards, tables, input areas, and code blocks.
backgroundColor = "#FFF9F2"
secondaryBackgroundColor = "#FCEBDD"

# Dark brown text complements the orange and cream palette.
textColor = "#33251D"
linkColor = "#A93D16"

# Clean body text with distinctive headings.
font = "sans-serif"
headingFont = "serif"
codeFont = "monospace"

# Rounded elements give RecipeMe a friendly appearance.
baseRadius = "medium"
buttonRadius = "medium"

# Light orange-brown outlines keep form fields visible.
borderColor = "#E8CBB8"
showWidgetBorder = true


# ------------------------------------------------------------
# RecipeMe sidebar
# ------------------------------------------------------------

[theme.sidebar]

# Deep olive green contrasts with the orange RecipeMe branding.
backgroundColor = "#263D32"
secondaryBackgroundColor = "#354F42"

# Warm white sidebar text.
textColor = "#FFF8EF"

# Burnt-orange accent for selected links and controls.
primaryColor = "#E66B32"

# Subtle green outlines for sidebar elements.
borderColor = "#486556"